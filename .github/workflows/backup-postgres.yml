name: Postgres Nightly Backup

# S71-5 (B5): Cross-vendor safety net — nightly pg_dump → R2 backup bucket.
# Complements Neon PITR (7d free / 30d paid) with offsite immutable archive.
# RPO = 24h via this path (Neon PITR has RPO ~5min as primary; this is fallback).
# RTO = 30min via DR runbook §3.2 procedure.

env:
  NODE_VERSION: '22'
  RETENTION_DAYS: 30
  BACKUP_BUCKET: theiadvisor-backups

on:
  schedule:
    # 03:00 UTC daily (00:00 BRT — low-traffic window).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run reason (audit trail)'
        required: false
        default: 'manual-trigger'

concurrency:
  group: backup-postgres
  cancel-in-progress: false # never cancel in-flight backup

jobs:
  dump:
    name: pg_dump → R2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # S83: needed by the failure-alert step, which opens/updates a GitHub Issue.
    # `contents: read` is the checkout minimum; `issues: write` is the alert channel.
    # Declared explicitly so the workflow does not depend on the repository's
    # default GITHUB_TOKEN permission setting, which can be tightened later.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6

      # S83: rewritten. Previous version ran `apt-get install postgresql-client awscli`
      # and broke on the ubuntu-latest image. Two independent problems:
      #   (a) awscli — the runner image already ships AWS CLI v2 at /usr/local/bin/aws.
      #       Installing the apt package (v1) is redundant and can conflict.
      #   (b) postgresql-client — the distro package tracks the Ubuntu release, not the
      #       server. pg_dump REFUSES to dump a server newer than itself ("aborting
      #       because of server version mismatch"). Pinning to the PGDG repo and taking
      #       the newest client is forward-compatible: a newer pg_dump handles older
      #       servers, never the reverse.
      - name: Install postgresql-client (PGDG) + verify awscli
        run: |
          set -euo pipefail

          # awscli: use the preinstalled v2 when present; only install if genuinely absent.
          if command -v aws >/dev/null 2>&1; then
            echo "::notice::aws already present — $(aws --version 2>&1)"
          else
            echo "::warning::aws not found on runner image — installing v2 from upstream"
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi

          # postgresql-client from PGDG (apt.postgresql.org), newest available client.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          # Retry: apt mirrors on hosted runners fail transiently often enough to matter.
          for attempt in 1 2 3; do
            if sudo apt-get update -qq; then break; fi
            echo "::warning::apt-get update failed (attempt $attempt/3) — retrying in 5s"
            sleep 5
          done

          # Meta-package from PGDG always resolves to the newest client available,
          # so this does not need editing when Neon upgrades its server major.
          sudo apt-get install -y -qq postgresql-client

          # /usr/bin/pg_dump is NOT the real binary on Debian/Ubuntu — it is
          # pg_wrapper, which picks a versioned binary from /usr/lib/postgresql/*/bin.
          # The runner image ships postgresql-client-16, and the wrapper kept
          # resolving to it even after 17 was installed, producing:
          #   "aborting because of server version mismatch
          #    server version: 17.10; pg_dump version: 16.14"
          # Pin PATH to the highest versioned bindir so every later step gets the
          # newest client. Sorting with `sort -V` keeps this correct past v9→v10.
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$PG_BIN" ]]; then
            echo "::error::no postgresql client bindir found under /usr/lib/postgresql"
            exit 1
          fi
          echo "$PG_BIN" >> "$GITHUB_PATH"
          export PATH="$PG_BIN:$PATH"

          echo "::notice::using client from $PG_BIN"
          pg_dump --version
          pg_restore --version
          aws --version

      # S83: fail fast with a readable message. Without this, a missing secret
      # surfaces as `connection to server on socket "/var/run/postgresql/..."
      # failed`, which points at a local Postgres that was never involved and
      # sends the reader down the wrong path entirely.
      - name: Verify required secrets are present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP_RO }}
          R2_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          MISSING=""
          [[ -z "${DATABASE_URL:-}" ]] && MISSING="$MISSING DATABASE_URL_BACKUP_RO"
          [[ -z "${R2_KEY_ID:-}"    ]] && MISSING="$MISSING R2_BACKUP_ACCESS_KEY_ID"
          [[ -z "${R2_SECRET:-}"    ]] && MISSING="$MISSING R2_BACKUP_SECRET_ACCESS_KEY"
          [[ -z "${R2_ACCOUNT:-}"   ]] && MISSING="$MISSING R2_ACCOUNT_ID"
          if [[ -n "$MISSING" ]]; then
            echo "::error::Missing repository secrets:$MISSING"
            {
              echo "## Backup aborted — secrets ausentes"
              echo ""
              echo "Configurar em Settings > Secrets and variables > Actions:"
              for s in $MISSING; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice::all 4 required secrets present"

      - name: Capture timestamp + git context
        id: ctx
        run: |
          TS=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          DATE=$(date -u +%Y-%m-%d)
          {
            echo "ts=$TS"
            echo "date=$DATE"
            echo "key=postgres/$DATE/theiadvisor-prod-$TS.dump"
            echo "manifest_key=postgres/$DATE/manifest.json"
          } >> "$GITHUB_OUTPUT"

      - name: pg_dump (custom format, compressed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP_RO }}
        run: |
          set -euo pipefail
          # --format=custom: pg_restore-friendly, parallel-restorable, compressed
          # --no-owner / --no-privileges: portable across environments
          # --verbose: progress to stderr (captured by Actions)
          pg_dump \
            --format=custom \
            --no-owner \
            --no-privileges \
            --verbose \
            --file=/tmp/dump.bin \
            "$DATABASE_URL" 2>&1 | tail -50
          ls -la /tmp/dump.bin
          DUMP_SIZE=$(stat -c%s /tmp/dump.bin)
          echo "DUMP_SIZE=$DUMP_SIZE" >> "$GITHUB_ENV"
          if [ "$DUMP_SIZE" -lt 1024 ]; then
            echo "::error::Dump suspiciously small ($DUMP_SIZE bytes) — abort upload"
            exit 1
          fi

      - name: Compute SHA-256 + verify dump integrity
        run: |
          set -euo pipefail
          SHA=$(sha256sum /tmp/dump.bin | awk '{print $1}')
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          # Verify dump is parseable (pg_restore --list works)
          pg_restore --list /tmp/dump.bin > /tmp/dump-toc.txt
          ROW_COUNT=$(wc -l < /tmp/dump-toc.txt)
          echo "TOC_ROWS=$ROW_COUNT" >> "$GITHUB_ENV"
          if [ "$ROW_COUNT" -lt 10 ]; then
            echo "::error::Dump TOC has <10 rows ($ROW_COUNT) — likely incomplete schema"
            exit 1
          fi
          echo "::notice::Dump integrity OK — sha256=${SHA:0:12}... toc_rows=$ROW_COUNT size=$DUMP_SIZE bytes"

      - name: Upload to R2 (S3-compatible)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          KEY: ${{ steps.ctx.outputs.key }}
          MANIFEST_KEY: ${{ steps.ctx.outputs.manifest_key }}
          TS: ${{ steps.ctx.outputs.ts }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Upload dump
          aws s3 cp /tmp/dump.bin "s3://${BACKUP_BUCKET}/${KEY}" \
            --endpoint-url "$ENDPOINT" \
            --metadata "sha256=${SHA},rows=${TOC_ROWS},size=${DUMP_SIZE},commit=${GITHUB_SHA}"
          # Write manifest (manifest.json — facilita restore lookup)
          cat > /tmp/manifest.json <<EOF
          {
            "timestamp": "${TS}",
            "key": "${KEY}",
            "sha256": "${SHA}",
            "size_bytes": ${DUMP_SIZE},
            "toc_rows": ${TOC_ROWS},
            "commit": "${GITHUB_SHA}",
            "workflow_run": "${GITHUB_RUN_ID}"
          }
          EOF
          aws s3 cp /tmp/manifest.json "s3://${BACKUP_BUCKET}/${MANIFEST_KEY}" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/json
          echo "::notice::Uploaded ${KEY} ($(numfmt --to=iec --suffix=B $DUMP_SIZE))"

      - name: Prune old backups (>30d)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          CUTOFF=$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%d)
          echo "Pruning backups older than $CUTOFF..."
          # List all dated prefixes; delete those before cutoff
          aws s3 ls "s3://${BACKUP_BUCKET}/postgres/" \
            --endpoint-url "$ENDPOINT" \
            --recursive 2>/dev/null | awk '{print $4}' | while read -r KEY; do
            # Extract date from key path (postgres/YYYY-MM-DD/...)
            BACKUP_DATE=$(echo "$KEY" | grep -oP 'postgres/\K\d{4}-\d{2}-\d{2}' | head -1)
            if [ -n "$BACKUP_DATE" ] && [ "$BACKUP_DATE" \< "$CUTOFF" ]; then
              echo "Deleting: $KEY ($BACKUP_DATE < $CUTOFF)"
              aws s3 rm "s3://${BACKUP_BUCKET}/${KEY}" --endpoint-url "$ENDPOINT" || true
            fi
          done

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Postgres Nightly Backup"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Timestamp (UTC) | ${{ steps.ctx.outputs.ts }} |"
            echo "| Key | \`${{ steps.ctx.outputs.key }}\` |"
            echo "| Size | ${DUMP_SIZE:-?} bytes |"
            echo "| TOC rows | ${TOC_ROWS:-?} |"
            echo "| SHA-256 | \`${SHA:-?}\` |"
            echo "| Retention | ${RETENTION_DAYS}d |"
            echo "| Trigger | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # S83: rewritten. The previous guard was `if: failure() && env.SENTRY_DSN != ''`
      # with SENTRY_DSN declared in the step's own `env:` block. A step's `if:` is
      # evaluated BEFORE that block is applied, so the expression always saw an empty
      # string, the condition was always false, and the alert NEVER fired — not once.
      # The backup failed every night from ~2026-06 to 2026-07-30 in complete silence.
      #
      # Replacement uses a GitHub Issue as the alert channel: no external secret to
      # misconfigure, visible in the repo, and deduplicated by the `backup-failure`
      # label so a persistent failure produces one thread, not fifty.
      - name: Open GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'backup-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            const body = [
              '**O backup noturno do Postgres falhou.**',
              '',
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Quando: ${new Date().toISOString()}`,
              '',
              'Enquanto isto estiver aberto, **não existe backup offsite do banco de producao**.',
              'Procedimento de recuperacao: `docs/operations/runbooks/disaster-recovery.md`.',
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.warning(`Backup failure appended to existing issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Backup noturno do Postgres esta falhando',
                body,
                labels: [label],
              });
              core.warning(`Backup failure issue opened: #${created.data.number}`);
            }
